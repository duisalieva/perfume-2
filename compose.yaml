services:

  backend:
    build: .
    ports:
      - "5051:5051" #все еще связываем как бы порты компьютера и порт докера
    environment:
      DB_HOST: sabog_docker_db 
      DB_NAME: ${POSTGRES_DB} # передается имя базы данных из файла окружения
      DB_USER: ${POSTGRES_USER} # передается имя пользователя из файла окружения
      DB_PASSWORD: ${POSTGRES_PASSWORD} # передается пароль из файла окружения
    depends_on:
      sabog_docker_db:
        condition: service_healthy 

  sabog_docker_db: 
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - perfume_data:/var/lib/postgresql/data #наше хранилище базы данных, в докере не в постгрес
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""] 
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  perfume_data: # volumes тут как бывает в учебниках том1 том2 - тут тоже про хранилище мы его назвали perfume_data